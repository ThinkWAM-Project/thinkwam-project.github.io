<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="418" viewBox="0 0 1440 418" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Mean inference latency</title><desc id="chart-desc">Mean model-call latency per action chunk, with a shared 0–600 ms axis. Batch size 1 and native chunk configurations. LIBERO and RoboTwin: A100 80GB, 10 warm-up and 60 timed calls. Real robot: RTX 4080 SUPER, 120 calls after warm-up. Hardware and protocols differ; these are not per-action or task-completion times. Values from performance-data-v14.json, latest supplied manuscript Tables 5 and 10.</desc>
