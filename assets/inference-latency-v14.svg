<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="565" viewBox="0 0 1440 565">
<title>Mean inference latency</title><desc>Three model-call latency panels on a common 0–600 milliseconds per action chunk axis. LIBERO and RoboTwin are measured on an A100 80GB, ten warmups followed by sixty timed calls. Real-robot latency is measured separately on an RTX 4080 SUPER after warmup, with 120 calls per model. Batch size is one; native action chunks and configurations differ. This is not per-action latency or physical task completion time. Data: latest Table 10 page 17 and Table 5 page 7; protocols pages 17–18.</desc>

